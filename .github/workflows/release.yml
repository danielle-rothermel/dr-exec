name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos-qualification:
    runs-on: depot-macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest -q -m platform_macos

  publish:
    needs: macos-qualification
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dr-exec
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Pushed tag '${GITHUB_REF_NAME}' does not match pyproject version (expected '${expected}')" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit '${GITHUB_SHA}' is not reachable from main" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.13"
          enable-cache: false
      - run: scripts/pre-check.sh
      - run: uv build
      # Publishes via PyPI Trusted Publishing (OIDC) — no API token.
      # Requires this repo/workflow to be registered as a (pending)
      # publisher for the dr-exec project on pypi.org.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
