#:schema ../../../.defs/terms.schema.json

[[terms]]
name = "importable entry point"
definition = """
An exact Python module name and module-level callable name resolved in the \
selected child runtime. It locates code without verifying code, package, \
interpreter, or dependency bytes."""

[[terms]]
name = "importable JSON process job"
definition = """
An execution job that invokes one importable entry point in a fresh local \
Python child and exchanges one canonical JSON value in each direction, subject \
to declared workload and executor self-budgets. It is one process-isolation, \
cancellation, failure, and run-record unit and owns no application scheduling \
or domain-effect policy."""
is_a = [
  "execution job",
]

[[terms]]
name = "run record reference"
definition = """
A serializable opaque locator through which the selected run store loads one \
run record and its finalized output artifacts. It exposes neither a filesystem \
path nor the store's internal layout."""
