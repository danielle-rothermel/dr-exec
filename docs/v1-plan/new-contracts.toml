# Standing rules introduced by the v1 design rather than direct refinements of
# a current repository contract.

[baseline]
source = ".defs/contracts.toml"
commit = "fda5f1102914b93c40617c4206311e80818a8f6e"
date = "2026-07-31"

[[contracts]]
title = "One canonical engine owns call-scoped execution"
statement = """
Every v1 public execution entry point routes through `dr_exec.engine`, the \
single internal implementation of spawn, I/O, lifecycle, budget enforcement, \
attribution, and recording; consumers do not import the engine directly."""
rationale = """
One internal path prevents target variants, pool orchestration, and direct calls \
from drifting on the invariants that make execution safe and attributable, \
while a private module boundary keeps consumers on the stable declaration \
surface."""
date = "2026-07-31"
enforcement_modes = ["constructed_invariant", "governance"]
enforcement = "Public modules delegate execution to the engine, the engine is excluded from the supported consumer API, and repository review rejects alternate spawn or lifecycle implementations."

[[contracts]]
title = "Representation type follows the data boundary"
statement = """
V1 uses frozen slotted dataclasses for internal value objects and serialization \
models for values that cross a process, persistence, fixture, or untrusted-input \
boundary."""
rationale = """
The representation itself should reveal where validation and schema stability \
are required; internal values need immutability, while boundary data needs \
explicit parsing and serialization semantics."""
date = "2026-08-03"
enforcement_modes = ["constructed_invariant", "governance"]
enforcement = "ExecutionJob, EnvGrant, lifecycle handles, and pool configuration use frozen slotted dataclasses because they remain live internal values; execution targets, protocol data, results, records, and receipts use strict frozen validation models at their boundaries."

[[contracts]]
title = "Executor runs are thread-safe"
statement = """
`Executor.run` is safe to invoke concurrently from threads in one parent \
process without sharing mutable per-run state or ambient configuration. \
`ExecutionPool` owns its mutable scheduler within one async lifecycle and does \
not imply cross-thread pool control."""
rationale = """
Consumers hold leases, heartbeats, and parallel evaluation work around executor \
calls, while the pool needs one explicit owner for admission, draining, and \
abort. Separating those guarantees prevents call-local execution state from \
becoming process-global scheduler state."""
date = "2026-08-03"
enforcement_modes = ["runtime_guarantee"]
enforcement = "ProcessExecutor and FakeExecutor keep run state call-local, allocate distinct scratch and record paths where applicable, synchronize fake state, and pass shared Executor conformance tests for concurrent run isolation; ExecutionPool rejects lifecycle operations outside its owning async context."

[[contracts]]
title = "Behavioral Protocols are governance boundaries"
statement = """
`Executor`, `Runtime`, and `RunStore` are the stable v1 behavioral capability \
boundaries. Adding or changing one requires explicit contract review; the normal \
extension path is a new concrete implementation that passes the shared semantic \
conformance suite. Serialized variants remain closed validated unions, and \
`ExecutionPool` remains the concrete v1 scheduling policy."""
rationale = """
Foundational execution behavior is especially vulnerable to locally plausible \
agent edits and parallel reimplementation. Small frozen Protocols make a change \
to the capability shape loud, while conformance tests distinguish semantic \
qualification from structural method compatibility."""
date = "2026-08-03"
enforcement_modes = ["constructed_invariant", "governance"]
enforcement = "The public protocols module exports only Executor, Runtime, and RunStore; every supported implementation runs its Protocol's behavioral conformance suite, and review rejects new scheduling Protocols or closed-data Protocols without a contract revision."

[[contracts]]
title = "One bounded execution pool owns host utilization"
statement = """
V1 makes `ExecutionJob` the only independently schedulable work unit and \
`ExecutionPool` the concrete host-local concurrency owner. Automatic capacity \
resolves once from usable CPUs, active jobs and prefetch remain bounded, finite \
and streaming inputs share the same scheduler, and every attempt receives one \
fresh child."""
rationale = """
Large HumanEval-style workflows must compile or load each generated sample once, \
run its internal tests sequentially, and evaluate many samples concurrently \
without creating one container, process, thread, or future per internal test or \
queued job."""
date = "2026-08-03"
enforcement_modes = ["constructed_invariant", "runtime_guarantee", "governance"]
enforcement = "run_many and run_stream delegate to ExecutionPool, automatic capacity records its effective value, admission and completion buffering are bounded, the source is pulled only when capacity exists, and implementation benchmarks pin throughput and resource high-water marks for the representative workload."

[[contracts]]
title = "Pinned semantics change only through contract revision"
statement = """
V1 semantics used in persisted identity, protocol interpretation, scoring, or \
child-observable behavior change only through an explicit contract revision and \
are golden-tested at the exact-literal level where a literal exists."""
rationale = """
Small locally plausible changes to bytes, invocation shape, attribution order, \
wire keys, or canonicalization can silently invalidate caches and experimental \
comparisons even when ordinary tests still pass."""
date = "2026-07-31"
enforcement_modes = ["governance"]
enforcement = "Persisted and child-observable literals have explicit contract markers and golden tests, and review accepts a semantic change only alongside a standing-contract revision."

[[contracts]]
title = "Unsupported consumers do not partially adopt v1"
statement = """
Consumers whose required behavior depends on a deferred v1 surface remain on \
their existing execution path until that complete surface exists; they do not \
wrap v1 to emulate arbitrary cwd, passthrough delivery, supervision, readiness, \
or interactive multi-process orchestration."""
rationale = """
Partial adoption would create competing lifecycle and containment semantics \
outside the canonical engine and make a deliberate scope boundary look like an \
accidental missing convenience."""
date = "2026-08-03"
enforcement_modes = ["scope_exclusion", "governance"]
enforcement = "Consumer requirements are checked against the supported v1 surface before adoption, deferred call sites remain on their existing execution path, and review rejects adapters that reconstruct an excluded surface."

[[contracts]]
title = "Consumers adopt dr-exec through pinned releases"
statement = """
Consumers depend on an explicit released dr-exec version; a local path \
dependency is allowed only during coordinated integration development and is \
replaced by a pinned release before adoption is declared complete."""
rationale = """
A pinned package makes changes to foundational execution machinery loud and \
reviewable, preserves experimental reproducibility, and prevents consumers from \
silently tracking repository state."""
date = "2026-08-03"
enforcement_modes = ["governance"]
enforcement = "Consumer dependency manifests and lockfiles pin a released version before adoption is declared complete; local path sources are limited to coordinated development and are removed from the finished integration."

[[contracts]]
title = "The design governs consumer integration"
statement = """
The accepted dr-exec contract determines target execution behavior. Each \
divergence in an integrating consumer is classified as a real domain obligation \
or an incidental artifact; consumer tests, schemas, and persisted formats align \
with that classification rather than redefining executor behavior."""
rationale = """
Treating every existing implementation detail as a requirement would preserve \
collapsed attribution, duplicated lifecycle machinery, and obsolete wire shapes \
instead of establishing one deliberate execution contract."""
date = "2026-08-03"
enforcement_modes = ["governance"]
enforcement = "Integration review records requirement-versus-artifact verdicts with the consumer change, preserves domain obligations outside dr-exec, and updates or removes consumer artifacts that conflict with the accepted executor contract."
