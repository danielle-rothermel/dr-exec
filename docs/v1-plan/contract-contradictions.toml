# V1 proposal clauses that cannot coexist with their frozen parent contracts.

[baseline]
source = ".defs/contracts.toml"
commit = "fda5f1102914b93c40617c4206311e80818a8f6e"
date = "2026-07-31"

[[contradictions]]
parent_title = "Budgets come from declared meaning"
parent_statement = """
Every resource axis is visibly budgeted or visibly unbudgeted: wall-clock and \
CPU limits are declared only; output caps are contract-derived or per-run \
machine-scale aggregates; RAM and disk have per-run aggregate machine-scale \
protection by default; process, file-size, and open-file limits are declared \
only; startup, termination, narration-volume, and record-volume executor \
self-budgets have built-in defaults; and per-item result size is declared by \
the protocol. \
Per-run machine protection never implicitly multiplies across concurrent runs, \
and every active budget crosses the process boundary in the same declared \
contract object rather than in parallel constants."""
parent_rationale = """
Interior defaults guess at research workloads and manufacture failures, while \
unstated absence hides exposure. Contract budgets reflect downstream meaning, \
machine protection turns chaotic capacity failures into attributed outcomes, \
and executor self-budgets keep operations such as startup and teardown from \
hanging. Batch- and fleet-level protection must be declared independently of \
per-run limits, and parallel parent and child constants inevitably drift."""
parent_date = "2026-07-31"
title = "V1 memory remains explicitly unbudgeted"
statement = """
V1 records memory as explicitly unbudgeted and provides no default RAM \
enforcement."""
rationale = """
The initial consumers do not supply a meaningful memory contract, and v1 does \
not yet include a containment mechanism that can enforce an aggregate \
machine-scale memory limit faithfully."""
conflict = "The parent contract says RAM has per-run aggregate machine-scale protection by default; v1 explicitly provides none."
enforcement_modes = ["modeled_outcome", "scope_exclusion"]
enforcement = "The budget declaration and run record serialize the memory axis as unbudgeted, and the v1 engine installs no RAM limiter."

[[contradictions]]
parent_title = "Call-scoped lifecycle completes before return"
parent_statement = """
For every call-scoped run, dr-exec concurrently feeds input and drains output, \
observes the child through exit, performs group-targeted termination and \
escalation on every exit path, ensures the entire child process tree is gone, \
and reaps the direct child before the call returns."""
parent_rationale = """
Sequential pipe handling can deadlock, leader-only signals leave descendants, \
and unreaped children become zombies. Lifecycle rigor is one executor \
responsibility shared by trusted and untrusted payloads rather than behavior \
each caller reimplements."""
parent_date = "2026-07-31"
title = "V1 teardown stops at the original process group"
statement = """
V1 tears down the original run process group before return but does not \
guarantee termination of a descendant that leaves that group by creating a new \
session."""
rationale = """
Closing the re-session escape requires a stronger platform mechanism such as a \
PID namespace, subreaper, or job object, which v1's sole containment profile \
does not provide."""
conflict = "The parent contract guarantees that the entire child process tree is gone before return; v1 permits a re-sessioned descendant to survive."
enforcement_modes = ["runtime_guarantee", "scope_exclusion"]
enforcement = "The engine performs bounded process-group termination and reaps the direct child, while the containment profile explicitly excludes descendants that leave the group from its reach."

[[contradictions]]
parent_title = "Every run is durably and faithfully observable"
parent_statement = """
Every run attempts a durable record from live execution through completion, \
including invocation, grants, budgets, timestamps, outcome, attribution, and \
output locations; narration is verbose by default and separate from payload \
output, capture is altered only by visibly recorded budget truncation, and \
recording or narration failure is itself reported and executor-attributed \
without failing the run it observes."""
parent_rationale = """
Research runs are experiments: an unrecorded intermediate or silently edited \
stream cannot be recovered. Quiet defaults and executor-side redaction were \
rejected because noise is filterable but missing information is permanent, \
and only callers have the domain knowledge to redact safely after capture."""
parent_date = "2026-07-31"
title = "V1 permits explicit no-record runs"
statement = """
V1 accepts the explicit `Records.none()` declaration and performs no durable \
record attempt for that run."""
rationale = """
Hot-loop real-engine oracle tests need to execute production semantics without \
creating unbounded durable artifacts, and an explicit declaration keeps the \
absence visible at the call site."""
conflict = "The parent contract says every run attempts a durable record; Records.none() intentionally suppresses that attempt."
enforcement_modes = ["constructed_invariant", "scope_exclusion"]
enforcement = "Every entry point has a records keyword with no default, and selecting Records.none() constructs a run configuration whose record writer is absent."
