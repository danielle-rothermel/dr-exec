# V1 proposal clauses that cannot coexist with their frozen parent contracts.

[baseline]
source = ".defs/contracts.toml"
commit = "fda5f1102914b93c40617c4206311e80818a8f6e"
date = "2026-07-31"

[[contradictions]]
parent_title = "Budgets come from declared meaning"
parent_statement = """
Every resource axis is visibly budgeted or visibly unbudgeted: wall-clock and \
CPU limits are declared only; output caps are contract-derived or per-run \
machine-scale aggregates; RAM and disk have per-run aggregate machine-scale \
protection by default; process, file-size, and open-file limits are declared \
only; startup, termination, narration-volume, and record-volume executor \
self-budgets have built-in defaults; and per-item result size is declared by \
the protocol. \
Per-run machine protection never implicitly multiplies across concurrent runs, \
and every active budget crosses the process boundary in the same declared \
contract object rather than in parallel constants."""
parent_rationale = """
Interior defaults guess at research workloads and manufacture failures, while \
unstated absence hides exposure. Contract budgets reflect downstream meaning, \
machine protection turns chaotic capacity failures into attributed outcomes, \
and executor self-budgets keep operations such as startup and teardown from \
hanging. Batch- and fleet-level protection must be declared independently of \
per-run limits, and parallel parent and child constants inevitably drift."""
parent_date = "2026-07-31"
title = "V1 machine-protection axes default to unbudgeted"
statement = """
V1 defaults every workload axis, including memory and disk, to explicit \
`UNBUDGETED`. A caller may select a supported finite budget, but v1 provides no \
default aggregate RAM or disk enforcement."""
rationale = """
The initial consumers do not supply meaningful machine-protection limits, and \
v1 does not yet include a mechanism that can enforce aggregate RAM or disk \
protection faithfully. An explicit unbudgeted value records that limitation \
without manufacturing workload failures."""
conflict = "The parent contract requires per-run aggregate RAM and disk protection by default; v1 defaults both axes to explicit UNBUDGETED."
enforcement_modes = ["modeled_outcome", "scope_exclusion"]
enforcement = "Budgets.unbudgeted() is the default declaration, the effective declaration and run record preserve every unbudgeted axis, unsupported finite axes fail validation, and the v1 engine installs no aggregate RAM or disk limiter."

[[contradictions]]
parent_title = "Untrusted Python runs in a declared hermetic runtime"
parent_statement = """
Every untrusted Python run declares its interpreter and importable package set \
as inputs and uses a hermetic runtime by default, so no undeclared host input \
participates in execution."""
parent_rationale = """
Environment and workspace isolation alone do not control which interpreter or \
packages execute payload code. Making the runtime part of the declaration keeps \
machine-local installations from silently changing results while allowing a \
caller to grant a non-hermetic input visibly when the use case requires it."""
parent_date = "2026-07-31"
title = "V1 Python uses an isolated host runtime"
statement = """
V1 resolves one host Python executable to an absolute path, records that path \
and its runtime identity, and invokes it with `-I -c`. It does not declare or \
verify an interpreter manifest, standard-library bytes, or importable package \
closure and therefore does not claim hermetic execution."""
rationale = """
Isolated host Python is a small useful macOS boundary that can ship without \
pretending the host installation is content-verified. A verified uv-provisioned \
runtime remains a later implementation of the stable `Runtime` Protocol."""
conflict = "The parent contract requires a declared interpreter and package set with hermetic semantics; v1 records but does not verify the host runtime or package closure."
enforcement_modes = ["constructed_invariant", "scope_exclusion"]
enforcement = "IsolatedHostPythonRuntime constructs only the resolved `<executable> -I -c <source>` form, RuntimeRecord persists the resolved executable and runtime identity, and the v1 runtime vocabulary contains no hermetic or manifest-bearing variant."

[[contradictions]]
parent_title = "Call-scoped lifecycle completes before return"
parent_statement = """
For every call-scoped run, dr-exec concurrently feeds input and drains output, \
observes the child through exit, performs group-targeted termination and \
escalation on every exit path, ensures the entire child process tree is gone, \
and reaps the direct child before the call returns."""
parent_rationale = """
Sequential pipe handling can deadlock, leader-only signals leave descendants, \
and unreaped children become zombies. Lifecycle rigor is one executor \
responsibility shared by trusted and untrusted payloads rather than behavior \
each caller reimplements."""
parent_date = "2026-07-31"
title = "V1 teardown stops at the original process group"
statement = """
V1 tears down the original run process group before return but does not \
guarantee termination of a descendant that leaves that group by creating a new \
session."""
rationale = """
Closing the re-session escape requires a stronger platform mechanism such as a \
PID namespace, subreaper, or job object, which v1's sole containment profile \
does not provide."""
conflict = "The parent contract guarantees that the entire child process tree is gone before return; v1 permits a re-sessioned descendant to survive."
enforcement_modes = ["runtime_guarantee", "scope_exclusion"]
enforcement = "The engine performs bounded process-group termination and reaps the direct child, while the containment profile explicitly excludes descendants that leave the group from its reach."

[[contradictions]]
parent_title = "A batch preserves dimensional identity and partial work"
parent_statement = """
A batch is a declared cross-product of dimensions with explicit sharing \
boundaries; every item has exactly one dimension-indexed result, item failures \
remain data scoped to their sub-batch, malformed or missing protocol results \
are executor failures, the driver echoes request identity before results are \
trusted, and each result leaves the child incrementally so later failure cannot \
erase completed work."""
parent_rationale = """
A flat list loses failure and sharing structure, while whole-array protocols \
discard paid-for work when a child dies. Request echo and exact accounting \
detect stale, duplicate, unknown, or shape-invalid responses at the boundary; \
driver failures belong to the executor even though the driver runs beside the \
payload."""
parent_date = "2026-07-31"
title = "V1 schedules domain-free execution jobs"
statement = """
V1 makes one caller-defined `ExecutionJob` the scheduling and sharing unit and \
returns one `CompletedExecution` per job. The domain request and driver own any \
dimensions, internal items, and per-item completeness; dr-exec preserves each \
complete validated protocol output but does not model a cross-product or \
synthesize domain item results."""
rationale = """
The primary workload must compile or load one generated sample once, evaluate \
its complete test suite sequentially, and run many independent samples with \
bounded host concurrency. Keeping the job opaque lets other domains choose the \
same setup-sharing boundary without embedding HumanEval dimensions in dr-exec."""
conflict = "The parent contract requires dr-exec to model batch dimensions and exactly one result per item; v1 models only jobs and leaves internal item accounting to the domain driver."
enforcement_modes = ["constructed_invariant", "modeled_outcome", "scope_exclusion"]
enforcement = "ExecutionPool schedules only ExecutionJob values, Executor returns one CompletedExecution per job, the protocol validates framing and request identity while preserving accepted outputs, and domain adapters validate their own internal result sets."
