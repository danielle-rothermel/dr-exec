[[contracts]]
title = "Production execution is local POSIX qualified on macOS and Linux"
statement = """
`ProcessExecutor` v1 production execution runs one machine-local child per job \
on qualified POSIX platforms through one direct-argv execution path. It \
invokes no shell or remote executor. In-process importable JSON execution \
uses a separate executor and is not isolated by a child process. Worker pool \
importable JSON execution uses a separate executor whose worker processes \
provide parallelism, not isolation."""
rationale = """
Qualified POSIX platforms and one lifecycle owner keep spawning, transport, \
budget enforcement, teardown, attribution, and recording on the same path."""
date = "2026-08-18"

[[contracts]]
title = "Trust is explicit and containment claims are narrow"
statement = """
Each target explicitly identifies trusted or untrusted payload content. \
Untrusted execution uses process-boundary-only containment: a distinct \
invocation, session, and process group, with the invoking user's filesystem, \
network, credentials, and process-spawning reach unchanged. It is neither an \
operating-system sandbox nor a hermetic interpreter and package closure."""
rationale = """
Binary identity does not establish payload trust, and process organization \
must not be presented as a restriction on what the payload can access."""
date = "2026-08-05"

[[contracts]]
title = "Inherited state and working directory are call-local"
statement = """
A child receives environment values only through its explicit grant, uses the \
working directory declared on its job, and inherits only the descriptors \
required by its target transport. A scratch working-directory grant creates a \
fresh per-run directory that the executor best-effort removes on every exit \
path; a caller working-directory grant uses the supplied absolute path, \
canonicalized through ``Path.resolve()`` for spawn and persistence, and the \
executor never removes it."""
rationale = """
Explicit state keeps concurrent attempts independent. Cleanup failure cannot \
replace an otherwise trustworthy result, and v1 has no narration surface on \
which to report it."""
date = "2026-08-18"

[[contracts]]
title = "Caller workspace paths persist as declaration evidence"
statement = """
Run records persist the resolved absolute path for caller working-directory \
grants on `RunDeclaration.workspace`. This is declaration evidence for replay \
and audit, not a store locator; `RunRecordReference` remains the only \
backend-neutral access path."""
rationale = """
Caller grants name a durable directory the executor does not own. Persisting \
the resolved path makes the declared cwd reconstructible without teaching \
callers to join storage layout."""
date = "2026-08-18"

[[contracts]]
title = "Parent shutdown signals map to cooperative cancellation"
statement = """
`forward_parent_signals()` installs SIGTERM and SIGINT handlers on the main \
thread that call `CancelToken.cancel()`. Cluster workers wrapping \
`ProcessExecutor.run_blocking()` should use it on the thread that receives \
parent shutdown so teardown runs through the normal cancellation and default \
finite `termination_time` grace path."""
rationale = """
Explicit parent-signal forwarding keeps shutdown behavior on the same \
cancellation and escalation path as in-process token cancellation."""
date = "2026-08-18"

[[contracts]]
title = "Isolated host Python is not a verified runtime closure"
statement = """
The v1 Python runtime resolves an absolute host interpreter, records reported \
runtime facts, and invokes it with isolated Python startup. It does not verify \
the interpreter, standard library, or installed package bytes and makes no \
hermetic package-closure claim."""
rationale = """
Isolated startup controls important Python-level ambient inputs without \
claiming integrity or reproducibility that host-managed files do not provide."""
date = "2026-08-05"

[[contracts]]
title = "Finite workload budgets name enforced limits"
statement = """
V1 enforces finite workload limits only for wall time, input bytes, and \
aggregate captured payload output. Memory, CPU time, process count, file size, \
open-file count, and disk axes are represented but must remain explicitly \
unbudgeted. Input overflow is rejected before spawn; wall-time overflow stops \
the run; output overflow follows the declared fail or marked-truncation policy."""
rationale = """
A finite declaration is truthful only when a v1 component enforces it. \
Unsupported protection remains visible as absent rather than being recorded as \
a guarantee that does not exist."""
date = "2026-08-05"

[[contracts]]
title = "Self-budgets are enforced only at owned v1 boundaries"
statement = """
Executor self-budgets default to explicitly unbudgeted except a finite \
30-second termination grace; ``ExecutorSelfBudgets.unbudgeted()`` opts every \
axis out explicitly. V1 enforces finite startup, termination, and join time, \
plus protocol frame bytes, total bytes, output count, and JSON depth. \
Run-record manifests publish within a fixed 256 MiB structural parser ceiling \
that is not an executor self-budget axis. V1 exposes no narration surface."""
rationale = """
A self-budget axis belongs in recorded identity only when v1 enforces it at an \
owned boundary. Structural parser ceilings are safety bounds, not caller \
self-budget declarations."""
date = "2026-08-18"

[[contracts]]
title = "Lifecycle reach ends at the original process group"
statement = """
An attempt that completes bootstrap session setup leads a fresh session and \
process group. Every post-spawn exit path tears down and reaps the direct child; \
after completed session setup teardown targets the original group, while \
failures before `setsid` or during session setup receive direct-child teardown \
only. A descendant that creates another session can leave the original group \
and survive. V1 provides no supervised or long-lived-child surface and no fleet \
abstraction."""
rationale = """
Process-group teardown reaches ordinary descendants after session setup, and \
direct-child teardown prevents zombies when setup fails, but neither can \
honestly promise containment of session escapees."""
date = "2026-08-05"

[[contracts]]
title = "Payload output is captured before durable finalization"
statement = """
V1 captures raw stdout and stderr in memory, retaining deterministic head and \
tail segments with exact produced and dropped byte counts. The run store writes \
those retained bytes to sidecars during finalization. V1 provides no payload \
output streaming, spooling, or stdio-passthrough mode."""
rationale = """
One capture model keeps output evidence deterministic and distinct from the \
protected structured protocol. Sidecars are durable finalization artifacts, \
not live output transports."""
date = "2026-08-05"

[[contracts]]
title = "Recognized outcomes are data without caller policy"
statement = """
Every trustworthy recognized attempt produces one structured result; a \
parent-side machinery failure that prevents a trustworthy result raises. Exit \
status remains uninterpreted data, and failure attribution is a best-effort \
single-owner diagnosis from available evidence. V1 defines no exit-policy, \
retry, or channel-attribution contract."""
rationale = """
Separating observation from domain policy preserves spawn, signal, budget, \
protocol, cancellation, and ordinary exit distinctions without promising \
causal proof or retry safety."""
date = "2026-08-05"

[[contracts]]
title = "Production attempts have durable lifecycle records"
statement = """
A production attempt prepares its record before spawn, publishes running state \
only after a successful spawn, and finalizes every recognized result. Recording \
degradation is reported through the receipt with the latest valid durable state \
and does not replace the execution outcome. Run-record directory identity and \
`AttemptId` derive deterministically from the caller-supplied `JobId`; dr-exec \
mints no internal random execution or record identifiers. A deterministic \
directory with no loadable lifecycle record is reclaimed before retry. \
Run-record manifests \
publish within fixed structural byte and depth ceilings and load through bounded, \
descriptor-pinned canonical reads before strict lifecycle validation. Fake \
calls create no production record."""
rationale = """
Lifecycle ordering preserves recoverable experimental evidence while keeping \
recording health distinct from what the child did. Deterministic record \
addressing lets replay land attempt-keyed alongside its predecessor instead of \
forking a fresh random record."""
date = "2026-08-06"

[[contracts]]
title = "Executor calls are concurrently isolated"
statement = """
Every `Executor.run_blocking()` implementation is safe for concurrent isolated \
calls. The scheduler invokes one executor instance from multiple worker \
threads, so each call owns independent mutable attempt state."""
rationale = """
The scheduler's capacity model depends on overlapping calls, not executor \
cloning or external serialization."""
date = "2026-08-05"

[[contracts]]
title = "Awaitable run offloads blocking work once"
statement = """
`Executor.run()` is awaitable and offloads to `run_blocking()` through one \
package-owned offload helper. Most executors use `asyncio.to_thread`; \
`ImportableJsonExecutor.run()` uses `offload_blocking_daemon` for in-process \
Ctrl+C semantics. Pooled execution calls `run_blocking()` directly on \
scheduler worker threads with no second offload. \
`WorkerPoolImportableJsonExecutor.close()` is awaitable and offloads to \
`close_blocking()` through the same `asyncio.to_thread` helper; sync `with` \
and `__exit__` call `close_blocking()` directly with no second offload. No \
async `Runtime` or `RunStore` Protocol follows."""
rationale = """
Blocking syscalls have no async form, so the blocking primitive stays on the \
Protocol while async callers get one owned offload path instead of re-deriving \
it per consumer."""
date = "2026-08-11"

[[contracts]]
title = "Fake execution preserves only shared caller contracts"
statement = """
`FakeExecutor.run_blocking()` uses shared declaration validation, returns only \
fake receipts and creates no durable state, and captures exact calls \
thread-safely. It performs no host checks, spawning, or containment behavior."""
rationale = """
The fake preserves declaration and concurrency semantics without implying \
production platform support, durable evidence, or containment."""
date = "2026-08-05"

[[contracts]]
title = "Structured Python output uses one protected protocol"
statement = """
A trusted or untrusted Python child receives one canonical request followed by \
EOF and emits a versioned, request-bound canonical-NDJSON stream on a protected \
descriptor. Complete accepted protocol outputs remain structured data and are \
not decoded from, mixed with, or truncated like stdout and stderr."""
rationale = """
One separate grammar makes identity binding, framing, byte accounting, exact \
completion, and partial-output preservation deterministic."""
date = "2026-08-05"

[[contracts]]
title = "Scheduling bounds resident work and reuses no child"
statement = """
The host-local scheduler keeps admitted and completed-but-undelivered jobs \
within one shared capacity bound, backpressures its source, and delivers \
completions in completion order. Every `ProcessExecutor` production job \
executes in a fresh child; `ProcessExecutor` provides no warm-child reuse. \
Worker pool importable JSON execution deliberately reuses long-lived worker \
processes for parallelism, creating no durable record and making no containment \
claim. V1 provides no dimension model or cross-product batching. `run_batch` \
and each executor's `run_many` accept an optional finite batch `wall_time` \
that is a scheduler lifecycle bound, not a per-job workload budget."""
rationale = """
One resident bound prevents unbounded intake while keeping domain dimensions \
and completeness outside execution infrastructure. Scheduling capacity is the \
only resource `ProcessExecutor` reuses across jobs; where a mode reuses more, \
it says so and gives up the guarantees the fresh child provided."""
date = "2026-08-05"

[[contracts]]
title = "Scheduler break drops undelivered work"
statement = """
When scheduling machinery breaks, the pool raises `SchedulerBroken`. Buffered \
completions drain before the raise; queued admitted work is cancelled with no \
terminal outcome; in-flight results arriving after delivery ends are not \
delivered. Consumers must reconcile the entire in-flight window rather than \
trust per-job results alone. Generations dropped by a break have no \
`CompletedExecution` and must be accounted as failed infrastructure, \
requeueable by caller retry policy rather than by `dr-exec`."""
rationale = """
This is the only path that produces no terminal outcome. Silent under-count \
against the planned population corrupts downstream accounting."""
date = "2026-08-11"

[[contracts]]
title = "Importable JSON process jobs reuse the execution path"
statement = """
An importable JSON process job is an ordinary execution job run through the \
selected `Executor`. Its adapter constructs the target and interprets the \
completion; spawning, environment grants, lifecycle limits, cancellation, \
scheduling, and recording remain with their existing owners. Trusted and \
untrusted Python targets use the same mechanism and differ only in their trust \
and containment declarations and corresponding evidence."""
rationale = """
This keeps process lifecycle, limits, containment, cleanup, and evidence on one \
path."""
date = "2026-08-08"

[[contracts]]
title = "Importable entry points are declarations, not code identities"
statement = """
An importable entry point names one fully qualified Python module and one \
module-level attribute. The selected child runtime performs the exact import \
and one attribute lookup, which must produce a callable; relative modules, \
filesystem paths, expressions, and attribute traversal are unsupported. \
`dr-exec` provides no registry; callers enforce allowlists before job \
construction. The declaration contributes to canonical target identity, while \
existing runtime facts retain their meaning; neither verifies source, package, \
interpreter, dependency bytes, or portability."""
rationale = """
Exact fail-closed lookup is auditable without making application authorization \
or ambient code identity a `dr-exec` guarantee."""
date = "2026-08-08"

[[contracts]]
title = "Callable input and output are JSON"
statement = """
The adapter sends one strict JSON value in canonical form and accepts exactly \
one such result through one fixed private identity envelope. Job input and \
executor protocol budgets default to unbudgeted; callers may select their \
existing finite limits, and the adapter adds no limit model or configuration \
inspection. Results use the protected execution protocol, not payload stdout \
or stderr. Arbitrary Python object serialization and custom codecs are \
unsupported."""
rationale = """
One data grammar keeps results inspectable and separate from diagnostics \
without another transport or limit model."""
date = "2026-08-08"

[[contracts]]
title = "Adapter interpretation preserves execution evidence"
statement = """
Syntactically invalid entrypoints and non-JSON input fail before spawn. \
Post-spawn resolution, invocation, and output failures retain existing \
execution and protocol representations; the adapter adds no wire frame or \
outcome kind. A completion is an adapter success only when it exits cleanly \
with code zero and contains exactly one valid output; otherwise its execution \
result and record receipt remain the failure evidence."""
rationale = """
The adapter validates result shape without reclassifying execution evidence."""
date = "2026-08-08"

[[contracts]]
title = "Scheduling and domain effects remain caller-owned"
statement = """
The adapter handles one job and owns neither concurrency nor durable scheduling. \
Standalone fan-out uses `ExecutionPool`; durable workflows invoke one job per \
stage without a nested local pool by default. One job is one isolation, \
cancellation, failure, and recording unit; its JSON value may contain a finite \
caller-owned batch only when its members may share that fate. The adapter \
provides no batch envelope, mapping, per-item result, or per-item retry. It owns \
no other application policy or domain-effect API and makes no side-effect-free \
guarantee."""
rationale = """
This keeps execution separate from workflow and domain policy."""
date = "2026-08-08"

[[contracts]]
title = "Run-record access is store-owned and backend-neutral"
statement = """
Real lifecycle handles and receipts carry a serializable `RunRecordReference`, \
not a filesystem path. The selected `RunStore` accepts that reference to load \
the record and to read a named finalized artifact under a required finite byte \
limit; unsupported or unresolved references fail without path fallback. Only \
the store resolves physical layout. Retention, partitioning, archival, and \
deletion remain store or operator policy."""
rationale = """
Opaque access permits another store layout without changing persisted receipts \
or teaching callers to join storage paths."""
date = "2026-08-08"

[[contracts]]
title = "Degraded receipts discriminate executor infrastructure faults"
statement = """
When recording degrades because executor machinery raised `ExecutorFailure` or \
`SchedulerBroken`, each `RecordingFailure` carries the closed \
`failure_code` from that exception and leaves `detail` unset. When finalize \
degrades from a storage-layer fault such as `DocumentDirectoryError`, \
`RecordingFailure.detail` names the sanitized exception class and \
`failure_code` stays unset. Both shapes are pinned on the receipt wire \
contract."""
rationale = """
Closed executor codes survive receipt serialization without collapsing distinct \
raise sites into one class name, while storage faults keep the existing \
sanitized detail channel."""
date = "2026-08-12"

[[contracts]]
title = "Run-record load is for cross-process recovery"
statement = """
`RunStore.load()` validates a lifecycle record and every finalized sidecar for \
cross-process recovery. In-frame store transitions carry the manifest header and \
declaration forward on typed handles and must not reload what the same call \
frame just wrote."""
rationale = """
Recording one execution should cost microseconds of ordering, not a re-parse \
per transition. The recovery-only reader serves a different consumer than the \
in-frame writer."""
date = "2026-08-11"

[[contracts]]
title = "In-process importable JSON provides throughput, not isolation"
statement = """
`ImportableJsonExecutor` runs trusted `InProcessImportableJsonTarget` jobs \
synchronously in the caller interpreter through one importable entry point \
lookup and one JSON call. It creates no durable run record, accepts no \
environment grant, accepts only scratch working-directory grants, rejects \
process and untrusted targets, rejects finite payload_output budgets, and \
makes no containment claim beyond caller-side trust in the declared entry \
point."""
rationale = """
Trusted preprocessing and similar workloads need pool-driven throughput without \
a second thread pool or subprocess overhead. The separate target kind keeps \
isolation expectations explicit."""
date = "2026-08-10"

[[contracts]]
title = "In-process cancellation is cooperative"
statement = """
For in-process importable JSON jobs, finite wall time arms a one-shot cancel \
signal when the budget expires. The worker thread cannot hard-stop arbitrary \
Python user code; cancellation is observed before dispatch and after the entry \
point returns. `ImportableJsonExecutor.run_blocking()` maps \
`KeyboardInterrupt` to \
`ExitedOutcome(1)` so pools stay healthy; Ctrl+C does not propagate through \
`run()`. `await ImportableJsonExecutor.run()` offloads on a daemon thread and \
maps Ctrl+C at the await boundary to the same `ExitedOutcome(1)` without \
propagating through `run()`; the entry point may continue until it returns \
because sync Python in another thread cannot be hard-stopped."""
rationale = """
Honest cancellation semantics avoid presenting in-process execution as \
forcibly bounded when only cooperative observation is available."""
date = "2026-08-10"

[[contracts]]
title = "Worker pools give parallelism, not isolation or records"
statement = """
`WorkerPoolImportableJsonExecutor` runs trusted `InProcessImportableJsonTarget` \
jobs across long-lived worker processes. Workers are freshly spawned \
interpreters, never forked, and each imports its entry point exactly once, so a \
pool is bound to one entry point for its lifetime and rejects jobs naming \
another. Worker processes exist for parallelism on real cores: the mode creates \
no durable run record, accepts no environment grant, accepts only scratch \
working-directory grants, and makes no containment or isolation claim, though \
crash containment follows as a side effect. The parent and worker exchange the \
existing importable JSON envelope as canonical JSON over dedicated pipes with \
no pickle in either direction, and the parent drains a worker's results \
concurrently with writing its requests so no payload size can deadlock the pair."""
rationale = """
Trusted CPU-bound fan-out has no execution mode when spawn-per-job startup \
dominates millisecond work and in-process threads serialize under the GIL. \
Naming what worker processes do not provide keeps the isolation and evidence \
guarantees where they are actually enforced."""
date = "2026-08-11"

[[contracts]]
title = "Every worker pool job produces exactly one completion"
statement = """
A worker that dies while a job is in flight fails that job immediately, \
observed through pipe EOF and child reaping rather than through elapsed time. \
Job-caused death is the worker's signal or exit code attributed to the payload; \
executor-owned failure, including a worker's startup import failure, is \
`ProtocolFailedOutcome` attributed to the executor, and an operating-system \
spawn failure is `SpawnFailedOutcome`. The pool then respawns into the freed \
slot and continues. No job is retried, failed over, quarantined, silently \
dropped, or left waiting on a dead pipe. Closing a pool terminates its live \
workers rather than waiting for a slot a running job may never return, so a \
job in flight at close completes through that same worker-death path instead \
of blocking the caller. After close, new jobs fail cleanly as \
`ProtocolFailedOutcome` rather than reusing terminated workers left in idle \
slots. A worker does not outlive the parent that owns it: an \
idle worker ends at request-pipe EOF, and a worker inside a job ends when it \
observes that it has been reparented. Every worker exit, including those \
paths, an uncaught `BaseException` from a payload, and a failed startup \
import, SIGKILLs the process group the worker leads so a descendant that \
inherited the result pipe cannot hold the parent on EOF. Leftovers from a \
job that already returned die the same way. A descendant that creates \
another session can leave the group and survive. That cleanup bounds only \
an orphan's survival, never a job's runtime or a payload's size."""
rationale = """
Loud, attributed failure is the only honest report when a process disappears \
mid-job, and retrying work whose side effects are unknown would be worse than \
failing it. A parent killed abnormally never gets to clean up, so a worker \
that cannot reach anyone with its answer has to end itself and the ordinary \
descendants it spawned rather than hold a core indefinitely."""
date = "2026-08-21"

[[contracts]]
title = "Worker pool budgets stay unbudgeted until declared"
statement = """
Worker pool jobs default to `Budgets.unbudgeted()` and receive no deadline, \
timer, watchdog, size limit, queue bound, worker recycling, jobs-per-worker \
ceiling, idle timeout, restart budget, or heartbeat. Only a caller-declared \
finite wall-time budget arms a deadline, enforced by terminating the worker's \
process group and completing the job as `BudgetExceededOutcome`; caller \
cancellation takes the same path and completes as `CancelledOutcome`. A finite \
input-bytes budget is checked before dispatch and a finite payload_output \
budget is rejected, as for in-process jobs. A declared stop condition covers \
the whole job, including the wait for a worker's entry-point import, so a \
blocking import cannot outlive it. `run_many` and `run_batch` may declare a \
finite batch `wall_time` that cancels remaining work as `CancelledOutcome`. \
`map_stream` concurrency is a parallelism width whose default saturates the \
workers rather than throttling them, and a map stream delivers only its own \
submissions' completions so streams sharing a pool never starve each other."""
rationale = """
Terminating a worker's process group is what makes a declared wall-time budget \
real for ordinary descendants rather than advisory, and confining every limit \
to explicit declaration keeps the mode's defaults honest about imposing none."""
date = "2026-08-20"

[[contracts]]
title = "A batch wall deadline is a scheduler lifecycle bound"
statement = """
`run_batch` and each concrete executor's `run_many` accept an optional finite \
`wall_time`. The default is no operation-wide ceiling. On expiry the private \
scheduler cancels live tokens and births later tokens already cancelled so \
in-flight jobs tear down through each executor's existing cancel path and \
remaining source jobs still complete as `CancelledOutcome`. That path stays \
cooperative for in-process jobs: an entry point that never returns can still \
hold the batch past the deadline. The watcher stays armed through early-close \
or source-error drain so a declared deadline can still cancel admitted work. \
The bound is neither a per-job workload budget nor an executor self-budget. \
`ExecutionPool`, `open_pool`, and `map_stream` do not take this deadline."""
rationale = """
A batch ceiling is a lifecycle concern of the batch primitive. Reusing \
scheduler tokens keeps one cancellation path and one outcome kind rather than \
asking every caller to wrap `run_many` with a clock. In-process honesty stays \
with the executor that cannot hard-stop Python."""
date = "2026-08-21"
