[[contracts]]
title = "Production execution is local and macOS-only"
statement = """
`ProcessExecutor` v1 production execution runs one machine-local child per job \
on macOS through one direct-argv execution path. It invokes no shell or remote \
executor. In-process importable JSON execution uses a separate executor and is \
not isolated by a child process."""
rationale = """
One qualified platform and one lifecycle owner keep spawning, transport, \
budget enforcement, teardown, attribution, and recording on the same path."""
date = "2026-08-05"

[[contracts]]
title = "Trust is explicit and containment claims are narrow"
statement = """
Each target explicitly identifies trusted or untrusted payload content. \
Untrusted execution uses process-boundary-only containment: a distinct \
invocation, session, and process group, with the invoking user's filesystem, \
network, credentials, and process-spawning reach unchanged. It is neither an \
operating-system sandbox nor a hermetic interpreter and package closure."""
rationale = """
Binary identity does not establish payload trust, and process organization \
must not be presented as a restriction on what the payload can access."""
date = "2026-08-05"

[[contracts]]
title = "Inherited state and scratch space are call-local"
statement = """
A child receives environment values only through its explicit grant, uses a \
fresh per-run scratch directory as its working directory, and inherits only \
the descriptors required by its target transport. Scratch cleanup is attempted \
on every exit path but is best-effort and silent."""
rationale = """
Explicit state keeps concurrent attempts independent. Cleanup failure cannot \
replace an otherwise trustworthy result, and v1 has no narration surface on \
which to report it."""
date = "2026-08-05"

[[contracts]]
title = "Isolated host Python is not a verified runtime closure"
statement = """
The v1 Python runtime resolves an absolute host interpreter, records reported \
runtime facts, and invokes it with isolated Python startup. It does not verify \
the interpreter, standard library, or installed package bytes and makes no \
hermetic package-closure claim."""
rationale = """
Isolated startup controls important Python-level ambient inputs without \
claiming integrity or reproducibility that host-managed files do not provide."""
date = "2026-08-05"

[[contracts]]
title = "Finite workload budgets name enforced limits"
statement = """
V1 enforces finite workload limits only for wall time, input bytes, and \
aggregate captured payload output. Memory, CPU time, process count, file size, \
open-file count, and disk axes are represented but must remain explicitly \
unbudgeted. Input overflow is rejected before spawn; wall-time overflow stops \
the run; output overflow follows the declared fail or marked-truncation policy."""
rationale = """
A finite declaration is truthful only when a v1 component enforces it. \
Unsupported protection remains visible as absent rather than being recorded as \
a guarantee that does not exist."""
date = "2026-08-05"

[[contracts]]
title = "Self-budgets are enforced only at owned v1 boundaries"
statement = """
Executor self-budgets default to explicitly unbudgeted. V1 enforces finite \
startup, termination, and join time, plus protocol frame bytes, total bytes, \
output count, and JSON depth. The caller-configurable `manifest_bytes` executor \
self-budget has no v1 enforcement point; the fixed run-record parser and \
storage ceilings are structural boundaries, not enforcement of that \
declaration. Narration bytes, recording-failure count, and failure-detail bytes \
are also represented but unenforced. V1 exposes no narration surface."""
rationale = """
Representing an axis preserves the declaration vocabulary, but representation \
alone does not bound an operation or provide a bounded-return guarantee."""
date = "2026-08-06"

[[contracts]]
title = "Lifecycle reach ends at the original process group"
statement = """
An attempt that completes bootstrap session setup leads a fresh session and \
process group. Every post-spawn exit path tears down and reaps the direct child; \
after completed session setup teardown targets the original group, while \
failures before `setsid` or during session setup receive direct-child teardown \
only. A descendant that creates another session can leave the original group \
and survive. V1 provides no supervised or long-lived-child surface and no fleet \
abstraction."""
rationale = """
Process-group teardown reaches ordinary descendants after session setup, and \
direct-child teardown prevents zombies when setup fails, but neither can \
honestly promise containment of session escapees."""
date = "2026-08-05"

[[contracts]]
title = "Payload output is captured before durable finalization"
statement = """
V1 captures raw stdout and stderr in memory, retaining deterministic head and \
tail segments with exact produced and dropped byte counts. The run store writes \
those retained bytes to sidecars during finalization. V1 provides no payload \
output streaming, spooling, or stdio-passthrough mode."""
rationale = """
One capture model keeps output evidence deterministic and distinct from the \
protected structured protocol. Sidecars are durable finalization artifacts, \
not live output transports."""
date = "2026-08-05"

[[contracts]]
title = "Recognized outcomes are data without caller policy"
statement = """
Every trustworthy recognized attempt produces one structured result; a \
parent-side machinery failure that prevents a trustworthy result raises. Exit \
status remains uninterpreted data, and failure attribution is a best-effort \
single-owner diagnosis from available evidence. V1 defines no exit-policy, \
retry, or channel-attribution contract."""
rationale = """
Separating observation from domain policy preserves spawn, signal, budget, \
protocol, cancellation, and ordinary exit distinctions without promising \
causal proof or retry safety."""
date = "2026-08-05"

[[contracts]]
title = "Production attempts have durable lifecycle records"
statement = """
A production attempt prepares its record before spawn, publishes running state \
only after a successful spawn, and finalizes every recognized result. Recording \
degradation is reported through the receipt with the latest valid durable state \
and does not replace the execution outcome. Run-record manifests publish within \
fixed structural byte and depth ceilings and load through bounded, \
descriptor-pinned canonical reads before strict lifecycle validation. Fake \
calls create no production record."""
rationale = """
Lifecycle ordering preserves recoverable experimental evidence while keeping \
recording health distinct from what the child did."""
date = "2026-08-06"

[[contracts]]
title = "Executor calls are concurrently isolated"
statement = """
Every `Executor.run()` implementation is safe for concurrent isolated calls. \
The scheduler invokes one executor instance from multiple worker threads, so \
each call owns independent mutable attempt state."""
rationale = """
The scheduler's capacity model depends on overlapping calls, not executor \
cloning or external serialization."""
date = "2026-08-05"

[[contracts]]
title = "Fake execution preserves only shared caller contracts"
statement = """
`FakeExecutor.run()` uses shared declaration validation, returns only fake \
receipts and creates no durable state, and captures exact calls thread-safely. \
It performs no host checks, spawning, or containment behavior."""
rationale = """
The fake preserves declaration and concurrency semantics without implying \
production platform support, durable evidence, or containment."""
date = "2026-08-05"

[[contracts]]
title = "Structured Python output uses one protected protocol"
statement = """
A trusted or untrusted Python child receives one canonical request followed by \
EOF and emits a versioned, request-bound canonical-NDJSON stream on a protected \
descriptor. Complete accepted protocol outputs remain structured data and are \
not decoded from, mixed with, or truncated like stdout and stderr."""
rationale = """
One separate grammar makes identity binding, framing, byte accounting, exact \
completion, and partial-output preservation deterministic."""
date = "2026-08-05"

[[contracts]]
title = "Scheduling bounds resident work and reuses no child"
statement = """
The host-local scheduler keeps admitted and completed-but-undelivered jobs \
within one shared capacity bound, backpressures its source, and delivers \
completions in completion order. Every production job executes in a fresh \
child. V1 provides no warm-child reuse, dimension model, or cross-product \
batching."""
rationale = """
One resident bound prevents unbounded intake while keeping domain dimensions \
and completeness outside execution infrastructure. Scheduling capacity is the \
only resource reused across jobs."""
date = "2026-08-05"

[[contracts]]
title = "Importable JSON process jobs reuse the execution path"
statement = """
An importable JSON process job is an ordinary execution job run through the \
selected `Executor`. Its adapter constructs the target and interprets the \
completion; spawning, environment grants, lifecycle limits, cancellation, \
scheduling, and recording remain with their existing owners. Trusted and \
untrusted Python targets use the same mechanism and differ only in their trust \
and containment declarations and corresponding evidence."""
rationale = """
This keeps process lifecycle, limits, containment, cleanup, and evidence on one \
path."""
date = "2026-08-08"

[[contracts]]
title = "Importable entry points are declarations, not code identities"
statement = """
An importable entry point names one fully qualified Python module and one \
module-level attribute. The selected child runtime performs the exact import \
and one attribute lookup, which must produce a callable; relative modules, \
filesystem paths, expressions, and attribute traversal are unsupported. \
`dr-exec` provides no registry; callers enforce allowlists before job \
construction. The declaration contributes to canonical target identity, while \
existing runtime facts retain their meaning; neither verifies source, package, \
interpreter, dependency bytes, or portability."""
rationale = """
Exact fail-closed lookup is auditable without making application authorization \
or ambient code identity a `dr-exec` guarantee."""
date = "2026-08-08"

[[contracts]]
title = "Callable input and output are JSON"
statement = """
The adapter sends one strict JSON value in canonical form and accepts exactly \
one such result through one fixed private identity envelope. Job input and \
executor protocol budgets default to unbudgeted; callers may select their \
existing finite limits, and the adapter adds no limit model or configuration \
inspection. Results use the protected execution protocol, not payload stdout \
or stderr. Arbitrary Python object serialization and custom codecs are \
unsupported."""
rationale = """
One data grammar keeps results inspectable and separate from diagnostics \
without another transport or limit model."""
date = "2026-08-08"

[[contracts]]
title = "Adapter interpretation preserves execution evidence"
statement = """
Syntactically invalid entrypoints and non-JSON input fail before spawn. \
Post-spawn resolution, invocation, and output failures retain existing \
execution and protocol representations; the adapter adds no wire frame or \
outcome kind. A completion is an adapter success only when it exits cleanly \
with code zero and contains exactly one valid output; otherwise its execution \
result and record receipt remain the failure evidence."""
rationale = """
The adapter validates result shape without reclassifying execution evidence."""
date = "2026-08-08"

[[contracts]]
title = "Scheduling and domain effects remain caller-owned"
statement = """
The adapter handles one job and owns neither concurrency nor durable scheduling. \
Standalone fan-out uses `ExecutionPool`; durable workflows invoke one job per \
stage without a nested local pool by default. One job is one isolation, \
cancellation, failure, and recording unit; its JSON value may contain a finite \
caller-owned batch only when its members may share that fate. The adapter \
provides no batch envelope, mapping, per-item result, or per-item retry. It owns \
no other application policy or domain-effect API and makes no side-effect-free \
guarantee."""
rationale = """
This keeps execution separate from workflow and domain policy."""
date = "2026-08-08"

[[contracts]]
title = "Run-record access is store-owned and backend-neutral"
statement = """
Real lifecycle handles and receipts carry a serializable `RunRecordReference`, \
not a filesystem path. The selected `RunStore` accepts that reference to load \
the record and to read a named finalized artifact under a required finite byte \
limit; unsupported or unresolved references fail without path fallback. Only \
the store resolves physical layout. Retention, partitioning, archival, and \
deletion remain store or operator policy."""
rationale = """
Opaque access permits another store layout without changing persisted receipts \
or teaching callers to join storage paths."""
date = "2026-08-08"

[[contracts]]
title = "In-process importable JSON provides throughput, not isolation"
statement = """
`ImportableJsonExecutor` runs trusted `InProcessImportableJsonTarget` jobs \
synchronously in the caller interpreter through one importable entry point \
lookup and one JSON call. It creates no durable run record, accepts no \
environment grant, rejects process and untrusted targets, rejects finite \
payload_output budgets, and makes no containment claim beyond caller-side \
trust in the declared entry point."""
rationale = """
Trusted preprocessing and similar workloads need pool-driven throughput without \
a second thread pool or subprocess overhead. The separate target kind keeps \
isolation expectations explicit."""
date = "2026-08-10"

[[contracts]]
title = "In-process cancellation is cooperative"
statement = """
For in-process importable JSON jobs, finite wall time arms a one-shot cancel \
signal when the budget expires. The worker thread cannot hard-stop arbitrary \
Python user code; cancellation is observed before dispatch and after the entry \
point returns. `ImportableJsonExecutor.run()` also maps `KeyboardInterrupt` to \
`ExitedOutcome(1)` so pools stay healthy; Ctrl+C does not propagate through \
`run()`."""
rationale = """
Honest cancellation semantics avoid presenting in-process execution as \
forcibly bounded when only cooperative observation is available."""
date = "2026-08-10"
