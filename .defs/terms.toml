#:schema ./terms.schema.json

[[terms]]
name = "payload"
definition = """
Content executed or interpreted by a child process. Its trust category follows \
who controls the content, not which binary receives it."""

[[terms]]
name = "trusted payload"
definition = """
Payload content controlled by the caller and treated as ordinary program input, \
not as adversarial content."""
exported_symbols = [
  "dr_exec.TrustedCommandTarget",
  "dr_exec.TrustedPythonTarget",
]

[[terms]]
name = "untrusted payload"
definition = """
Payload content outside the caller's control and assumed able to exercise every \
permission left available by its declared containment."""
exported_symbols = [
  "dr_exec.UntrustedCommandTarget",
  "dr_exec.UntrustedPythonTarget",
]

[[terms]]
name = "process-boundary-only containment"
definition = """
Invocation and process-group isolation without filesystem, network, credential, \
or package-closure restriction. Descendants may escape its lifecycle reach by \
creating another session."""
exported_symbols = [
  "dr_exec.ContainmentProfile.PROCESS_BOUNDARY_ONLY",
]

[[terms]]
name = "isolated host Python"
definition = """
A host interpreter invoked with Python isolation controls. Its recorded runtime \
facts identify observed configuration, not verified interpreter or package \
bytes."""
exported_symbols = [
  "dr_exec.IsolatedHostPythonRuntime",
]

[[terms]]
name = "scratch workspace"
definition = """
An executor-owned working directory dedicated to one execution attempt when the \
job declares a scratch working-directory grant. It is separate from \
caller-owned paths and other attempts."""

[[terms]]
name = "caller workspace"
definition = """
A caller-supplied directory used as the child working directory when the job \
declares a caller working-directory grant. The executor uses the resolved \
absolute path but does not create or remove the directory."""

[[terms]]
name = "workload budget"
definition = """
A caller-declared limit on payload work. It is distinct from limits on \
executor-owned mechanics."""
exported_symbols = [
  "dr_exec.Budgets",
]

[[terms]]
name = "executor self-budget"
definition = """
A limit on executor-owned mechanics such as startup, teardown, joining, or \
protected-protocol handling. It is distinct from a workload budget."""
exported_symbols = [
  "dr_exec.ExecutorSelfBudgets",
]

[[terms]]
name = "unbudgeted"
definition = """
An explicit declaration that the executor installs no policy limit for an \
axis. It is neither an unlimited-resource promise nor a bounded-return \
guarantee."""

[[terms]]
name = "captured payload output"
definition = """
Raw stdout and stderr retained by the executor for an execution result and run \
record rather than streamed or passed through directly."""

[[terms]]
name = "output overflow policy"
definition = """
The declared response to aggregate captured-output overflow: terminate with an \
attributed budget outcome or continue with visible marked truncation."""
exported_symbols = [
  "dr_exec.OutputOverflowPolicy",
]

[[terms]]
name = "execution protocol"
definition = """
The protected canonical-NDJSON channel used by trusted and untrusted Python \
for structured, request-bound messages. It is separate from payload stdout and \
stderr."""

[[terms]]
name = "protocol output"
definition = """
A complete validated structured document emitted through the protected Python \
protocol. It is distinct from arbitrary stdout and stderr bytes."""

[[terms]]
name = "execution job"
definition = """
One caller-defined unit containing an execution target, environment grant, \
working-directory grant, and workload budgets for execution and scheduling."""
exported_symbols = [
  "dr_exec.ExecutionJob",
  "dr_exec.WorkingDirectoryGrant",
  "dr_exec.WorkingDirectoryGrantKind",
]

[[terms]]
name = "execution pool"
definition = """
The host-local scheduler that admits execution jobs under a shared resident \
capacity and returns their completions."""
exported_symbols = [
  "dr_exec.ExecutionPool",
]

[[terms]]
name = "run result"
definition = """
Structured evidence for one trustworthy recognized attempt outcome, including \
payload output, protocol output, measurements, and best-effort attribution."""
exported_symbols = [
  "dr_exec.ExecutionResult",
]

[[terms]]
name = "run record"
definition = """
Durable lifecycle evidence for a production attempt, including its declaration, \
process evidence, result, and output artifacts. It is distinct from the run \
result, which describes execution rather than persistence."""
exported_symbols = [
  "dr_exec.RunRecord",
]

[[terms]]
name = "attribution"
definition = """
A best-effort classification of one failure owner from parent-observable \
evidence. It is not causal proof and does not imply channel identity or retry \
eligibility."""
exported_symbols = [
  "dr_exec.ExecutionAttribution",
]

[[terms]]
name = "executor failure code"
definition = """
A closed discriminator for executor-side infrastructure faults surfaced on \
`ExecutorFailure` and, when recording degrades, persisted on \
`RecordingFailure.failure_code`. Storage-layer finalize faults continue to \
report a sanitized exception class name in `RecordingFailure.detail` instead."""
exported_symbols = [
  "dr_exec.ExecutorFailureCode",
]

[[terms]]
name = "importable entry point"
definition = """
An exact Python module name and module-level callable name resolved in the \
selected child runtime. It locates code without verifying code, package, \
interpreter, or dependency bytes."""

[[terms]]
name = "importable JSON process job"
definition = """
An execution job that invokes one importable entry point in a fresh local \
Python child and exchanges one canonical JSON value in each direction, subject \
to declared workload and executor self-budgets. It is one process-isolation, \
cancellation, failure, and run-record unit and owns no application scheduling \
or domain-effect policy."""
is_a = [
  "execution job",
]

[[terms]]
name = "in-process importable JSON job"
definition = """
An execution job whose target names one trusted importable entry point and one \
canonical JSON request for synchronous invocation in the caller interpreter. It \
accepts no environment grant, creates no durable run record, and provides \
throughput rather than process isolation."""
exported_symbols = [
  "dr_exec.InProcessImportableJsonTarget",
  "dr_exec.ImportableJsonExecutor",
  "dr_exec.build_in_process_importable_json_job",
]

[[terms]]
name = "worker pool importable JSON execution"
definition = """
An execution mode that runs in-process importable JSON jobs across long-lived \
worker processes, each a freshly spawned interpreter that imports the job's \
entry point once and then serves jobs over dedicated pipes. It provides \
parallelism on real cores and enforces a declared finite wall-time budget by \
terminating the worker and the process group it leads; it accepts no \
environment grant, creates no durable run record, and makes no containment or \
isolation claim. A pool is bound to one entry point for its lifetime."""
exported_symbols = [
  "dr_exec.WorkerPoolImportableJsonExecutor",
  "dr_exec.WorkerPoolRecordReceipt",
]

[[terms]]
name = "run record reference"
definition = """
A serializable opaque locator through which the selected run store loads one \
run record and its finalized output artifacts. It exposes neither a filesystem \
path nor the store's internal layout."""
