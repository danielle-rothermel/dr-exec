[[terms]]
name = "payload"
definition = """
Content executed or interpreted by a child process. Its trust category follows \
who controls the content, not which binary receives it."""

[[terms]]
name = "trusted payload"
definition = """
Payload content controlled by the caller and treated as ordinary program input, \
not as adversarial content."""
exported_symbols = [
  "dr_exec.TrustedCommandTarget",
]

[[terms]]
name = "untrusted payload"
definition = """
Payload content outside the caller's control and assumed able to exercise every \
permission left available by its declared containment."""
exported_symbols = [
  "dr_exec.UntrustedCommandTarget",
  "dr_exec.UntrustedPythonTarget",
]

[[terms]]
name = "process-boundary-only containment"
definition = """
Invocation and process-group isolation without filesystem, network, credential, \
or package-closure restriction. Descendants may escape its lifecycle reach by \
creating another session."""
exported_symbols = [
  "dr_exec.ContainmentProfile.PROCESS_BOUNDARY_ONLY",
]

[[terms]]
name = "isolated host Python"
definition = """
A host interpreter invoked with Python isolation controls. Its recorded runtime \
facts identify observed configuration, not verified interpreter or package \
bytes."""
exported_symbols = [
  "dr_exec.IsolatedHostPythonRuntime",
]

[[terms]]
name = "scratch workspace"
definition = """
A fresh executor-owned working directory for one attempt. Cleanup is attempted \
afterward but is best-effort and has no reporting surface in v1."""

[[terms]]
name = "workload budget"
definition = """
A caller declaration about payload work. A finite value is meaningful only on \
an axis the production executor enforces; other axes remain explicitly \
unbudgeted."""
exported_symbols = [
  "dr_exec.Budgets",
]

[[terms]]
name = "executor self-budget"
definition = """
A limit on executor-owned mechanics rather than payload work. V1 enforces only \
its lifecycle and protected-protocol axes; other represented axes do not imply \
an enforcement point."""
exported_symbols = [
  "dr_exec.ExecutorSelfBudgets",
]

[[terms]]
name = "unbudgeted"
definition = """
An explicit declaration that the executor installs no policy limit for an \
axis. It is neither an unlimited-resource promise nor a bounded-return \
guarantee."""

[[terms]]
name = "captured payload output"
definition = """
Raw stdout and stderr retained in memory until the attempt ends. A finite \
budget preserves declared head and tail evidence plus exact production and \
drop counts."""

[[terms]]
name = "output overflow policy"
definition = """
The declared response to aggregate captured-output overflow: terminate with an \
attributed budget outcome or continue with visible marked truncation."""
exported_symbols = [
  "dr_exec.OutputOverflowPolicy",
]

[[terms]]
name = "execution protocol"
definition = """
The protected canonical-NDJSON exchange used by untrusted Python: one \
request-bound prelude, consecutive complete outputs, and one matching terminal \
completion."""

[[terms]]
name = "protocol output"
definition = """
A complete validated structured document emitted through the protected Python \
protocol. It is distinct from arbitrary stdout and stderr bytes."""

[[terms]]
name = "execution job"
definition = """
One caller-defined execution and scheduling unit. Each production attempt of a \
job gets a fresh child; domain dimensions and internal work items remain opaque \
to dr-exec."""
exported_symbols = [
  "dr_exec.ExecutionJob",
]

[[terms]]
name = "execution pool"
definition = """
The host-local scheduler that bounds all admitted and undelivered work by one \
resident capacity, applies intake backpressure, and returns completions in \
completion order. It reuses capacity, not children."""
exported_symbols = [
  "dr_exec.ExecutionPool",
]

[[terms]]
name = "run result"
definition = """
Structured evidence for one trustworthy recognized attempt outcome, including \
payload output, protocol output, measurements, and best-effort attribution."""
exported_symbols = [
  "dr_exec.ExecutionResult",
]

[[terms]]
name = "run record"
definition = """
Durable lifecycle evidence for a production attempt. Declaration and diagnostic \
projections are secret-safe; protocol documents and retained stdout and stderr \
are caller-visible content preserved verbatim and may contain secrets. Sidecars \
are written during finalization and become record evidence only when the \
finalized manifest publishes; orphan sidecars beside an earlier manifest are \
ignored."""
exported_symbols = [
  "dr_exec.RunRecord",
]

[[terms]]
name = "attribution"
definition = """
A best-effort classification of one failure owner from parent-observable \
evidence. It is not causal proof and does not imply channel identity or retry \
eligibility."""
exported_symbols = [
  "dr_exec.ExecutionAttribution",
]
