[project]
name = "dr-exec"
version = "0.1.5"
description = "Contract-driven local process execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dr-serialize==0.1.2",
    "dr-store==0.2.0",
    "pydantic==2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.4.2",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: crosses a filesystem, runtime, or process boundary",
    "subprocess: starts, probes, or supervises a real child process",
    "platform_macos: qualifies behavior supported only on macOS",
    "serial_fork: calls os.fork directly and must run outside xdist workers",
]

[tool.ty.src]
include = ["scripts", "src", "tests"]
exclude = ["nbs"]
